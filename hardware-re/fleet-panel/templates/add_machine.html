{% extends "base.html" %}
{% block title %}Adicionar máquina - Painel DragX{% endblock %}
{% block content %}
<h1>Adicionar máquina manualmente</h1>
<p class="subtitle">
  Use isso só para máquinas onboardadas antes desse painel existir.
  Máquinas novas aparecem sozinhas quando você roda o onboard.py.
</p>
<form method="post" action="/machines/add" class="add-form">
  <label>Serial (adb)
    <input type="text" name="serial" required>
  </label>
  <label>Nome (opcional)
    <input type="text" name="name">
  </label>
  <button type="submit">Adicionar</button>
</form>
{% endblock %}
