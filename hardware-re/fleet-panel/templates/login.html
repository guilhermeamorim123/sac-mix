{% extends "base.html" %}
{% block title %}Entrar - Painel DragX{% endblock %}
{% block content %}
<div class="login-box">
  <h1>Entrar</h1>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Senha" autofocus>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
